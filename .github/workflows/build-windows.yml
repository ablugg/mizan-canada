name: Build Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write          # needed for SignPath signing

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.app from secret
        run: |
          echo "${{ secrets.ENV_APP }}" > .env.app
        shell: bash

      - name: Create empty vector-store directory
        run: mkdir -p data/vector-store
        shell: bash

      - name: Download Ollama (Windows)
        run: npx tsx scripts/download-ollama.ts

      - name: Build
        run: npm run electron:build -- --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mizan-canada
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-exe
          input-artifact-path: dist-electron/Mizan Canada.Setup.${{ github.ref_name }}.exe
          output-artifact-path: dist-electron/Mizan Canada.Setup.${{ github.ref_name }}.exe
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 600

      - name: Rename artifact for release
        run: |
          $version = "${{ github.ref_name }}"
          $src = "dist-electron/Mizan Canada.Setup.${version}.exe"
          $dst = "dist-electron/Mizan-Canada.Setup.${version}.exe"
          if (Test-Path $src) { Copy-Item $src $dst }
        shell: pwsh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/Mizan-Canada.Setup.*.exe
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
