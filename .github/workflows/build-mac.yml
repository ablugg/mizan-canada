name: Build macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .env.app from secret
        run: echo "${{ secrets.ENV_APP }}" > .env.app

      - name: Download pre-built vector store
        run: |
          gh release download data-v1 --repo ablugg/mizan-canada --pattern "vector-store.zip" --dir /tmp
          unzip -q /tmp/vector-store.zip -d .
          echo "Vector store size: $(du -sh data/vector-store/)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Ollama (macOS)
        run: npx tsx scripts/download-ollama.ts

      - name: Build
        run: npm run electron:build -- --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename artifacts (spaces to hyphens)
        run: |
          cd dist-electron
          for f in Mizan\ Canada-*; do
            newname=$(echo "$f" | sed 's/ /-/g')
            [ "$f" != "$newname" ] && cp "$f" "$newname"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/Mizan-Canada-*-arm64.dmg
            dist-electron/Mizan-Canada-*.dmg
            dist-electron/Mizan-Canada-*-arm64-mac.zip
            dist-electron/Mizan-Canada-*-mac.zip
            dist-electron/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
